name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: source/ui/.node-version
          cache: npm
          cache-dependency-path: source/ui/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm test

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: source/global.json
          cache: true
          cache-dependency-path: source/**/packages.lock.json
      - run: dotnet restore
      - run: dotnet build --configuration Release --no-restore
      - run: dotnet test --configuration Release --no-build
      - uses: actions/setup-node@v6
        with:
          node-version-file: source/ui/.node-version
          cache: npm
          cache-dependency-path: source/ui/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: source/ui
      - run: npm run test:integration
        working-directory: source/ui
