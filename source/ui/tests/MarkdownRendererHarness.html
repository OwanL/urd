<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        color-scheme: dark;
        font:
          15px/1.65 system-ui,
          sans-serif;
        color: #e7e7e7;
        background: #181818;
      }
      body {
        margin: 0;
        padding: 24px;
      }
      main {
        max-width: 800px;
        margin: auto;
        min-width: 0;
      }
      #transcript-scrollport {
        height: 320px;
        overflow: auto;
        overflow-anchor: none;
      }
      .neighbor-content {
        box-sizing: border-box;
        min-height: 120px;
        padding: 16px;
      }
      .neighbor-content[data-neighbor="after"] {
        min-height: 180px;
      }
    </style>
  </head>
  <body>
    <main>
      <div id="transcript-scrollport" role="region" aria-label="Transcript">
        <div class="neighbor-content" data-neighbor="before">Earlier transcript content</div>
        <div id="markdown-renderer"></div>
        <div class="neighbor-content" data-neighbor="after">Later transcript content</div>
      </div>
    </main>
    <script type="module" src="/tests/MarkdownRendererHarness.tsx"></script>
  </body>
</html>
