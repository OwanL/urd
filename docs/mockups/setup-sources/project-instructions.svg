<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
  <title id="title">Project instructions setup</title>
  <desc id="desc">A setup modal for ignoring project instruction filenames, folders, and files. Five of ten discovered files remain eligible, reducing the estimated pruner input from 12.4 thousand to 6.1 thousand tokens.</desc>
  <style>
    text { font-family: 'Segoe UI', sans-serif; }
    .header { fill: #858585; font-size: 12px; font-weight: 600; letter-spacing: 1.1px; }
    .title { fill: #f2f2f2; font-size: 29px; font-weight: 600; }
    .section { fill: #ededed; font-size: 15px; font-weight: 600; }
    .body { fill: #d5d5d5; font-size: 15px; }
    .muted { fill: #929292; font-size: 13px; }
    .small { fill: #858585; font-size: 12px; }
    .count { fill: #a6a6a6; font-size: 13px; }
    .button { fill: #ededed; font-size: 14px; font-weight: 600; }
    .check { fill: #e4e4e4; stroke: #e4e4e4; stroke-width: 1; }
    .unchecked { fill: #1a1a1a; stroke: #696969; stroke-width: 1; }
  </style>
  <rect width="800" height="800" fill="#080808"/>
  <rect x="70" y="34" width="660" height="732" rx="12" fill="#141414" stroke="#303030"/>
  <text x="98" y="76" class="header">URD  /  SETUP</text>
  <text x="702" y="76" class="header" text-anchor="end">4 OF 5</text>
  <text x="98" y="120" class="title">Project instructions</text>
  <text x="98" y="148" class="muted">Choose which instruction files to exclude from the pruner.</text>

  <line x1="98" y1="171" x2="702" y2="171" stroke="#303030"/>
  <text x="98" y="204" class="section">Ignore by filename</text>
  <text x="702" y="204" class="small" text-anchor="end">ACROSS ALL FOLDERS</text>
  <rect x="98" y="225" width="16" height="16" rx="3" class="unchecked"/>
  <text x="126" y="238" class="body">AGENTS.md</text>
  <text x="331" y="238" class="count" text-anchor="end">4 files</text>
  <rect x="391" y="225" width="16" height="16" rx="3" class="unchecked"/>
  <text x="419" y="238" class="body">CLAUDE.md</text>
  <text x="702" y="238" class="count" text-anchor="end">3 files</text>
  <rect x="98" y="263" width="16" height="16" rx="3" class="check"/>
  <path d="M102 271l3 3 5-6" fill="none" stroke="#151515" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="126" y="276" class="body">GEMINI.md</text>
  <text x="331" y="276" class="count" text-anchor="end">2 files</text>
  <rect x="391" y="263" width="16" height="16" rx="3" class="unchecked"/>
  <text x="419" y="276" class="body">APPEND_SYSTEM.md</text>
  <text x="702" y="276" class="count" text-anchor="end">1 file</text>

  <line x1="98" y1="299" x2="702" y2="299" stroke="#303030"/>
  <text x="98" y="333" class="section">Ignore by location</text>
  <text x="683" y="333" class="small" text-anchor="middle">IGNORE</text>
  <rect x="98" y="351" width="604" height="168" rx="7" fill="#191919" stroke="#303030"/>
  <path d="M119 371l4 4 4-4" fill="none" stroke="#858585" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M140 370h6l2 2h8v9h-16z" fill="none" stroke="#999" stroke-width="1.3" stroke-linejoin="round"/>
  <text x="168" y="381" class="body">repo</text>
  <text x="221" y="381" class="count">10 files</text>
  <rect x="675" y="368" width="16" height="16" rx="3" class="unchecked"/>
  <path d="M147 389v107 M147 409h17 M147 445h17 M147 481h17" fill="none" stroke="#3d3d3d" stroke-width="1"/>
  <path d="M171 404h6l2 2h8v9h-16z" fill="none" stroke="#999" stroke-width="1.3" stroke-linejoin="round"/>
  <text x="199" y="415" class="body">staged</text>
  <text x="259" y="415" class="count">2 files</text>
  <rect x="675" y="402" width="16" height="16" rx="3" class="check"/>
  <path d="M679 410l3 3 5-6" fill="none" stroke="#151515" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M172 438h11l4 4v10h-15z M183 438v4h4" fill="none" stroke="#999" stroke-width="1.2" stroke-linejoin="round"/>
  <text x="199" y="451" class="body">APPEND_SYSTEM.md</text>
  <rect x="675" y="438" width="16" height="16" rx="3" class="check"/>
  <path d="M679 446l3 3 5-6" fill="none" stroke="#151515" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M171 476h6l2 2h8v9h-16z" fill="none" stroke="#999" stroke-width="1.3" stroke-linejoin="round"/>
  <text x="199" y="487" class="body">src</text>
  <text x="230" y="487" class="count">4 files</text>
  <rect x="675" y="474" width="16" height="16" rx="3" class="unchecked"/>

  <rect x="98" y="538" width="604" height="116" rx="7" fill="#1b1b1b" stroke="#303030"/>
  <text x="116" y="565" class="section">Pruner estimate</text>
  <text x="684" y="565" class="muted" text-anchor="end">5 eligible / 10 discovered files</text>
  <line x1="116" y1="580" x2="684" y2="580" stroke="#343434"/>
  <text x="116" y="607" class="muted">Before ignore</text>
  <text x="116" y="632" class="body">~12.4k tokens</text>
  <path d="M369 615h25 M389 610l5 5-5 5" fill="none" stroke="#777" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="435" y="607" class="muted">After ignore</text>
  <text x="435" y="632" class="body">~6.1k tokens</text>
  <text x="684" y="632" class="count" text-anchor="end">−6.3k tokens</text>

  <line x1="98" y1="679" x2="702" y2="679" stroke="#303030"/>
  <rect x="98" y="700" width="79" height="38" rx="6" fill="#202020" stroke="#414141"/>
  <text x="137.5" y="724" class="button" text-anchor="middle">Back</text>
  <text x="584" y="724" class="body" text-anchor="middle">Skip</text>
  <rect x="622" y="700" width="80" height="38" rx="6" fill="#e5e5e5"/>
  <text x="662" y="724" fill="#151515" font-size="14" font-weight="600" text-anchor="middle">Next</text>
</svg>
